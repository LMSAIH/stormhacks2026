# Run the voice backend with ports + env wired up once:
#   docker compose up -d && docker compose logs -f
#
# REST is published on host :4000 (the container listens on 5000; host 5000 is taken by macOS
# AirPlay Receiver). The WebSocket is on :8765.
#
# The backend .env is bind-mounted to /app/.env — the app loads it itself (config.py), so secrets
# stay out of the image. This compose file lives at the repo root (which has no .env), so compose
# never tries to read backend/.env for interpolation — sidestepping the macOS permission block that
# breaks `--env-file` / a compose file placed inside backend/.
services:
  backend:
    build:
      context: ./backend
      # Install speaker-diarization deps (torch/resemblyzer/librosa) into the image.
      # Set to "0" to keep the image lean (captions still work, but no speaker labels).
      args:
        DIARIZATION: "1"
    image: voice-backend
    container_name: voice-backend
    # The container runs as a non-root user with no home dir; point library caches at a writable
    # dir so librosa/numba (used by the diarizer's embedder) can JIT-compile instead of crashing.
    environment:
      NUMBA_CACHE_DIR: /tmp
      HOME: /tmp
      XDG_CACHE_HOME: /tmp
    ports:
      - "4000:5000"
      - "8765:8765"
    volumes:
      - ./backend/.env:/app/.env:ro
    restart: unless-stopped
