[project]
name = "lipread"
version = "0.1.0"
description = "StormHacks 2026 lip reader: Auto-AVSR inference, fine-tuning glue, serving, ONNX export"
readme = "README.md"
# 3.11 exactly: vendored espnet imports distutils (gone in 3.12); mediapipe legacy solutions API.
requires-python = ">=3.11,<3.12"
dependencies = [
  # Pinned to the last releases that still ship torchvision.io.read_video / torchaudio.load,
  # which the vendored auto_avsr training code relies on.
  "torch==2.8.*",
  "torchvision==0.23.*",
  "torchaudio==2.8.*",
  # 0.10.21 still has mp.solutions.face_detection (BlazeFace 4 keypoints), which the
  # auto_avsr/Chaplin crop pipeline uses. Newer releases dropped the legacy API.
  "mediapipe==0.10.21",
  "opencv-contrib-python>=4.10",
  "numpy<2",
  "scikit-image>=0.22",
  "scipy>=1.11",
  "six>=1.16",
  "sentencepiece>=0.2",
  "av>=12",
  "huggingface_hub>=0.25",
  "jiwer>=3.0",
  # serving
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
]

[project.optional-dependencies]
train = [
  "pytorch-lightning>=2.4,<2.6",
  "wandb>=0.18",
  "faster-whisper>=1.0",
  "tqdm>=4.66",
]
export = [
  "onnx>=1.17",
  "onnxruntime>=1.22",
]
dev = [
  "pytest>=8",
  "pyarrow>=17",  # scripts/bench.py reads the LRS3 parquet
]

[project.scripts]
lipread = "lipread.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Vendored Chaplin espnet is installed as the top-level `espnet` package (inference).
# auto_avsr keeps its own espnet copy and runs from third_party/auto_avsr (training).
packages = ["src/lipread", "third_party/espnet"]

[tool.uv]
# CUDA 12.8 wheels cover the laptop RTX 4060 and RunPod RTX 4090 (and run fine on CPU).
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }
